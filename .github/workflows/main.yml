# This is a basic workflow to help you get started with Actions

name: CI

permissions:
  contents: read

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# The jobs only read the repository; deploys use repository secrets, not GITHUB_TOKEN.
permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prepare a test file
        run: |
          mkdir -p build/deploy
          echo -e "<html><head><title>Test</title></head><body><h1>Deploy $(date +'%s')</h1></body></html>" > build/deploy/index.html
          echo -e "<html><head><title>Test</title></head><body><h1>Deploy $(date +'%s')</h1></body></html>" > build/deploy-$(date +"%s").html
      - name: Deploy
        uses: ./
        with:
          customer: quant
          project: github-actions
          token: ${{ secrets.QUANT_TOKEN }}
          dir: build

  test-skip:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prepare a test file
        run: |
          mkdir -p build/deploy
          echo -e "<html><head><title>Test</title></head><body><h1>Deploy $(date +'%s')</h1></body></html>" > build/deploy/index.html

      # Deploy the state.
      - name: Deploy
        uses: ./
        with:
          customer: quant
          project: github-actions
          token: ${{ secrets.QUANT_TOKEN }}
          dir: build
          skip-unpublish: true
          skip-purge: true
          force: true
          chunk-size: 10

  test-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Create test functions
      - name: Prepare test functions
        run: |
          # Create directories
          mkdir -p functions
          mkdir -p build
          
          # Create an auth function
          cat > functions/auth.js << 'EOL'
          export default async function auth(request) {
            return { authenticated: true };
          }
          EOL
          
          # Create a filter function
          cat > functions/filter.js << 'EOL'
          export default async function filter(request) {
            return request;
          }
          EOL
          
          # Create an edge function
          cat > functions/function.js << 'EOL'
          export default async function handler(request) {
            return new Response("Hello from edge function!");
          }
          EOL
          
          # Create functions config file
          cat > functions/config.json << EOL
          [
            {
              "type": "auth",
              "path": "./functions/auth.js",
              "description": "Test auth function",
              "uuid": "11111111-1111-4111-a111-111111111111"
            },
            {
              "type": "filter",
              "path": "./functions/filter.js",
              "description": "Test filter function",
              "uuid": "22222222-2222-4222-a222-222222222222"
            },
            {
              "type": "function",
              "path": "./functions/function.js",
              "description": "Test edge function",
              "uuid": "33333333-3333-4333-a333-333333333333"
            }
          ]
          EOL

          # Create a dummy file in build directory
          echo "dummy file" > build/index.html

      # Test function deployment with config file
      - name: Test function deployment
        uses: ./
        with:
          customer: quant
          project: github-actions
          token: ${{ secrets.QUANT_TOKEN }}
          dir: build
          functions: "./functions/config.json"

  # CLI 7: a manifest entry without a uuid is refused before anything is uploaded.
  test-functions-require-uuid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prepare a manifest without a uuid
        run: |
          mkdir -p quant/edge-functions
          echo 'return new Response("x");' > quant/edge-functions/api.js
          echo '[{"type":"function","path":"quant/edge-functions/api.js","description":"No uuid"}]' > quant/edge-functions.json

      - name: Deploy must fail before upload
        id: deploy
        continue-on-error: true
        uses: ./
        with:
          customer: quant
          project: github-actions
          token: ${{ secrets.QUANT_TOKEN }}
          functions: quant/edge-functions.json

      - name: The deploy step failed
        if: steps.deploy.outcome != 'failure'
        run: |
          echo "::error::a manifest entry without a uuid was accepted"
          exit 1

  test-rules-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Valid rules inputs are accepted
        env:
          RULES: edge-rules.json
          FUNCTIONS: .quant-functions.json
          CUSTOMER: quant
          PROJECT: github-actions
          RULES_FORCE: "false"
          API_TOKEN: dummy
          API_BASE_URL: https://dashboard.quantcdn.io/api/v2
        run: ./scripts/validate-rules-inputs.sh

      - name: Inputs that would become extra CLI flags are refused
        run: |
          base=(RULES=edge-rules.json FUNCTIONS=.quant-functions.json CUSTOMER=quant PROJECT=github-actions RULES_FORCE=false API_TOKEN=dummy API_BASE_URL=https://dashboard.quantcdn.io/api/v2)
          for bad in "RULES=r.json --api-base-url=https://attacker.example/api/v2" "RULES=--api-token=x" 'RULES=r.json"x' \
                     "FUNCTIONS=f.json -c other" "CUSTOMER=quant --api-base-url=x" "PROJECT=-p" "RULES_FORCE=yes" \
                     "API_TOKEN=" "API_BASE_URL="; do
            if env "${base[@]}" "$bad" ./scripts/validate-rules-inputs.sh >/dev/null 2>&1; then
              echo "::error::accepted unsafe input: $bad"; exit 1
            fi
          done
          echo "All unsafe inputs refused."

